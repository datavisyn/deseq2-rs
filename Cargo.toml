[package]
name = "deseq2_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
# DESeq2 core, pulled from GitHub. Cargo.lock pins the commit, update with `make update-deseq2`.
# default-features = false leaves out the kallisto HDF5 reader we don't need.
rust_deseq2 = { git = "https://github.com/necoli1822/rust_deseq2", branch = "main", default-features = false }
ndarray = "0.17"
numpy = "0.29"
pyo3 = "0.29"
pyo3-log = "0.13"
log = "0.4"
rayon = "1.10"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = "thin"
codegen-units = 1
