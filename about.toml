# cargo-about config for THIRD_PARTY_LICENSES.md (`make licenses`), shipped in the wheels via `license-files`
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
# only what ends up in the wheel
ignore-build-dependencies = true
ignore-dev-dependencies = true
